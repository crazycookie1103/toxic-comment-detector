<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: white; font-family: 'Inter', sans-serif; height: 100vh; display: flex; align-items: center; }
        .auth-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; width: 100%; max-width: 400px; padding: 2rem; margin: auto; }
        .form-control { background: #1e293b; border: 1px solid #334155; color: white; margin-bottom: 1rem; }
        .form-control:focus { background: #1e293b; color: white; border-color: #38bdf8; box-shadow: none; }
        .btn-primary { background: #38bdf8; border: none; font-weight: bold; }
        label { display: block; margin-bottom: 5px; font-size: 0.9rem; color: #94a3b8; }
        ul { font-size: 0.75rem; color: #94a3b8; } /* Password requirements list */
    </style>
</head>
<body>
    <div class="auth-card">
        <h3 class="text-center mb-4 text-info">Create Account</h3>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary w-100 mt-2">Sign Up</button>
        </form>
        <div class="mt-3 text-center small">
            <span class="text-secondary">Already have an account?</span> 
            <a href="{% url 'login' %}" class="text-info text-decoration-none">Login</a>
        </div>
    </div>
</body>
</html>
